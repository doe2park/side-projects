<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111613" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="도쿄 지도">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
<title>도쿄 저장 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 왼쪽은 실제 해안선·구 경계·강·공원 위에 야마노테선을 얹은 지도(고정), 오른쪽은 장소 목록과 코스 탭 */
:root{
  --bg:#f3f5f2; --panel:#ffffff; --ink:#18201b; --muted:#66706a; --line:#dfe4de; --soft:#eaeee9;
  --rail:#7ab83b; --chuo:#e8762d; --accent:#1d6b47; --accent-ink:#ffffff; --route:#26304a; --route-ink:#ffffff;
  --water:#cddfe8; --land:#f8f9f6; --land-out:#eceee9; --ward:#cfd6cd; --ward-hi:#e3efe6; --park:#d5e7cb; --river:#a6c6da;
  --c-shop:#d4532c; --c-food:#2a66c9; --c-cafe:#a87412; --c-bar:#8340ad; --c-stay:#0f8585; --c-sight:#c03670;
  --t0:#2a66c9; --t1:#d4532c; --t2:#1f8a5b; --t3:#8340ad; --t4:#c03670; --t5:#a87412; --t6:#0f8585; --t-etc:#7b8494;
  --f-display:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Apple SD Gothic Neo",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --panel:#19201c; --ink:#e8ede9; --muted:#97a19b; --line:#2b342f; --soft:#212924;
  --rail:#8ccb4c; --chuo:#f0904f; --accent:#5cc28f; --accent-ink:#0d1a13; --route:#e9edf7; --route-ink:#141a2a;
  --water:#0f1d26; --land:#1b221e; --land-out:#161c19; --ward:#323d37; --ward-hi:#22362b; --park:#1f3424; --river:#29506a;
  --c-shop:#f0784f; --c-food:#6b9bf0; --c-cafe:#d9a43a; --c-bar:#b47ae0; --c-stay:#3cbcbc; --c-sight:#ec6c9f;
  --t0:#6b9bf0; --t1:#f0784f; --t2:#4cc38a; --t3:#b47ae0; --t4:#ec6c9f; --t5:#d9a43a; --t6:#3cbcbc; --t-etc:#98a1b0;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111613; --panel:#19201c; --ink:#e8ede9; --muted:#97a19b; --line:#2b342f; --soft:#212924;
  --rail:#8ccb4c; --chuo:#f0904f; --accent:#5cc28f; --accent-ink:#0d1a13; --route:#e9edf7; --route-ink:#141a2a;
  --water:#0f1d26; --land:#1b221e; --land-out:#161c19; --ward:#323d37; --ward-hi:#22362b; --park:#1f3424; --river:#29506a;
  --c-shop:#f0784f; --c-food:#6b9bf0; --c-cafe:#d9a43a; --c-bar:#b47ae0; --c-stay:#3cbcbc; --c-sight:#ec6c9f;
  --t0:#6b9bf0; --t1:#f0784f; --t2:#4cc38a; --t3:#b47ae0; --t4:#ec6c9f; --t5:#d9a43a; --t6:#3cbcbc; --t-etc:#98a1b0;
  color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:1400px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:center}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.roundel{width:44px;height:44px;border-radius:50%;border:5px solid var(--rail);display:grid;place-items:center;
  font-family:var(--f-display);font-weight:900;font-size:14px;flex:none;background:var(--panel)}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(22px,3vw,30px);line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.stats{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.stat b{display:block;font-family:var(--f-display);font-weight:900;font-size:22px;line-height:1}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.04em}

.controls{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:8px;padding:0 10px;height:38px}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;height:100%}
.search svg{flex:none;color:var(--muted)}
select{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel);padding:0 10px}
.seg{display:inline-flex;background:var(--soft);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:6px;padding:5px 10px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);font-size:13px;white-space:nowrap}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted))}
.chip .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.chips.subs .chip{height:28px;font-size:12px;padding:0 10px}

.main{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.mapbox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);height:calc(100vh - 40px);max-height:860px;min-height:440px;
  background:var(--water);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.drag{cursor:grabbing}
.areas{position:absolute;left:10px;right:56px;top:10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.areas::-webkit-scrollbar{display:none}
.areas button{flex:none;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);font-size:12px;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.areas button:hover{border-color:var(--ink)}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.zoom button{width:36px;height:36px;border:0;background:transparent;font-size:18px;line-height:1;display:grid;place-items:center}
.zoom button+button{border-top:1px solid var(--line)}
.legend{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:4px 10px;max-width:calc(100% - 20px);
  background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}
.legend .ln{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:4px;vertical-align:2px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-150%);display:none;max-width:260px;overflow:hidden;text-overflow:ellipsis}

.peek{position:absolute;left:10px;right:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);
  padding:12px 12px 12px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;border-left:5px solid var(--c)}
.peek .x{position:absolute;right:6px;top:4px;border:0;background:transparent;color:var(--muted);font-size:18px;width:28px;height:28px}
.peek .pn{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.3;overflow-wrap:anywhere;padding-right:20px}
.peek .pa{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px}
.tabs button{border:0;background:transparent;padding:8px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;line-height:18px;margin-left:4px;font-family:var(--f-mono)}

.listhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:var(--muted);font-size:13px}
.listhead b{color:var(--ink);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:8px}
.card{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:0 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px 11px 0;overflow:hidden;scroll-margin:80px}
.cmain{min-width:0;cursor:pointer}
.card .name{margin:0 0 2px;font-size:15px}
.name .st,.rn .st{color:var(--accent);vertical-align:-1px;margin-right:4px}
.cside{display:flex;gap:6px;align-items:center}
.svh{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 6px;font-size:13px;font-weight:700}
.svh:first-child{margin-top:2px}.svh span{color:var(--muted);font-weight:500;font-size:12px}
.inc{color:var(--route);font-weight:600}
.list{gap:6px}
.card .bar{align-self:stretch;background:var(--c);border-radius:0 3px 3px 0}
.card.sel{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 30%,transparent)}
.card.visited .name{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12px;color:var(--muted)}
.cat{color:var(--c);font-weight:600}
.name{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.3;margin:2px 0 6px;overflow-wrap:anywhere;cursor:pointer}
.name:hover{text-decoration:underline;text-underline-offset:3px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;padding:1px 7px;border-radius:4px;background:var(--soft);color:var(--muted)}
.acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.grp{display:flex;gap:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:32px;padding:0 11px;border-radius:7px;border:1px solid var(--line);background:var(--panel);font-size:12px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.on{border-color:var(--route);color:var(--route);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.ic{width:32px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--muted);padding:0}
.ic[aria-pressed="true"].fav{color:var(--accent);border-color:var(--accent)}
.btn.save{display:inline-flex;gap:4px;align-items:center}
.ic[aria-pressed="true"].vis{color:var(--accent);border-color:var(--accent)}
.empty{padding:32px 16px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:var(--r)}

/* 코스 */
.days{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.days .chip{height:30px}
.csum{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.csum .big{font-family:var(--f-display);font-weight:900;font-size:18px;font-variant-numeric:tabular-nums}
.csum .small{font-size:12px;color:var(--muted)}
.cacts{display:flex;flex-wrap:wrap;gap:6px}
.stops{display:flex;flex-direction:column}
.stop{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.num{width:26px;height:26px;border-radius:50%;background:var(--route);color:var(--route-ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px}
.stop .sn{font-family:var(--f-display);font-weight:700;line-height:1.3;overflow-wrap:anywhere;cursor:pointer}
.stop .sm{font-size:12px;color:var(--muted)}
.stop .ctl{display:flex;gap:2px}
.stop .ctl button{width:28px;height:28px;border:1px solid var(--line);background:var(--panel);border-radius:6px;color:var(--muted);padding:0;display:grid;place-items:center}
.stop .ctl button:disabled{opacity:.35}
.leg{display:flex;align-items:center;gap:8px;padding:6px 0 6px 22px;font-size:12px;color:var(--muted);border-left:2px dashed var(--route);margin-left:23px}
.leg a{color:var(--accent);font-weight:600;text-decoration:none}
.leg a:hover{text-decoration:underline}
.routes{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.foot{font-size:12px;color:var(--muted)}

/* 주변 추천 */
.recbase{margin-bottom:10px}
.chip svg{flex:none}
.rtop{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.rtop .big{font-family:var(--f-display);font-weight:900;font-size:17px;line-height:1.25}
.rtop .small{font-size:12px;color:var(--muted)}
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.htile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:60px;padding:10px 12px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);color:var(--ink)}
.htile b{font-family:var(--f-display);font-weight:700;font-size:14px;line-height:1.3}
.htile span{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.htile:disabled{opacity:.45}
.htile:not(:disabled):active{transform:scale(.97)}
.rmore{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;width:100%;padding-top:8px;border-top:1px solid var(--line)}
#recall{min-height:44px}
.rech{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 6px}
.rech h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:15px}
.rech .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:1px}
.rech span{font-size:12px;color:var(--muted)}
.ritem{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:0 10px;align-items:center;padding:9px 10px 9px 0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px;overflow:hidden}
.ritem .bar{align-self:stretch;background:var(--c);border-radius:0 3px 3px 0}
.ritem .rn{font-family:var(--f-display);font-weight:700;line-height:1.3;overflow-wrap:anywhere;cursor:pointer}
.ritem .rn svg{color:#e0a100;vertical-align:-2px;margin-right:3px}
.ritem .rm{font-size:12px;color:var(--muted)}
.ritem .ra{display:flex;gap:4px}
.toast{position:absolute;left:50%;top:calc(var(--top-h,56px) + 12px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.2);max-width:calc(100% - 32px);text-align:center}
.zoom button.busy{opacity:.45}
.zoom button.on{color:#2f7cf6}
.ti,.navbar{display:none}
*{-webkit-tap-highlight-color:transparent}
.sheet-grab,.mfilters{display:none}

/* 폰: 지도를 화면 전체에 깔고, 검색·분류는 위에 띄우고, 목록·추천·코스는 아래 시트로 */
@media (max-width:860px){
  html,body{overflow:hidden}
  body{padding:0}
  .wrap{padding:0;display:block}
  header.top{display:none}
  .controls{position:fixed;z-index:30;top:0;left:0;right:0;background:transparent;border:0;border-radius:0;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;gap:8px;pointer-events:none}
  .controls>*{pointer-events:auto}
  .search{height:46px;flex-basis:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.14);font-size:16px}
  .controls .chips{margin:0 -12px;padding:0 12px 4px;pointer-events:auto}
  .controls .chip{box-shadow:0 1px 4px rgba(0,0,0,.14)}
  .main{display:block}
  .mapbox{position:fixed;inset:0;height:auto;max-height:none;min-height:0;border:0;border-radius:0}
  .areas,.legend{display:none!important}
  .zoom{top:calc(var(--top-h,120px) + 8px)}
  .zoom #zin,.zoom #zout{display:none}
  .zoom button{width:42px;height:42px}
  .peek{bottom:calc(var(--sheet-vis,150px) + var(--nav-h) + 10px);transition:bottom .26s}
  .sheet{position:fixed;z-index:40;left:0;right:0;bottom:var(--nav-h);height:calc(100dvh - var(--top-h,120px) + 4px - var(--nav-h));background:var(--bg);
    border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.16);display:flex;flex-direction:column;will-change:transform}
  .sheet-grab{display:block;height:22px;flex:none;touch-action:none;cursor:grab}
  .sheet-grab::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:9px auto 0}
  .sheet .tabs{padding:0 12px;margin:0;flex:none;touch-action:none}
  .sheet .tabs button{flex:1;padding:10px 4px}
  .sheet-body{flex:1;min-height:0;overflow:auto;padding:4px 12px 24px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .mfilters{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .mfilters select{width:100%}
  .foot{margin-top:18px}
  /* 앱처럼: 아래 고정 탭바, 큰 터치 영역, 당겨서 새로고침·글자 선택 막기 */
  :root{--nav-h:calc(56px + env(safe-area-inset-bottom,0px))}
  html,body{overscroll-behavior:none;overflow:hidden;height:100%}
  button,.chip,.btn,.tabs,.card .name{-webkit-user-select:none;user-select:none}
  .navbar{display:block;position:fixed;z-index:45;left:0;right:0;bottom:0;height:var(--nav-h);padding-bottom:env(safe-area-inset-bottom,0px);
    background:var(--panel);border-top:1px solid var(--line)}
  .navbar .tabs{display:flex;gap:0;border:0;margin:0;padding:0 4px;height:56px}
  .navbar .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;

function matches(p, ignore){
  if (ignore!=="cat" && S.cat!=="전체" && p.c!==S.cat) return false;
  if (ignore!=="cat" && S.subs.size && !S.subs.has(p.s)) return false;
  if (S.ward!=="전체" && p.h!==S.ward) return false;
  const m = mk(p.cid);
  if (S.only==="fav" && !m.f) return false;
  if (S.only==="todo" && m.v) return false;
  if (S.only==="visited" && !m.v) return false;
  if (S.q){ const q=S.q.toLowerCase(); if (!(`${p.n} ${p.h} ${p.d} ${p.s} ${p.t||""} ${p.c} ${p.src}`.toLowerCase().includes(q))) return false; }
  return true;
}

function routeChunks(stops){
  // 구글맵 경로 하나에 출발+경유 8곳+도착 = 최대 10곳
  const out=[]; let i=0;
  while (i < stops.length-1){ const part = stops.slice(i, i+10); out.push(part); i += part.length-1; }
  return out;
}
function routeUrl(part, mode){
  const o=part[0], d=part[part.length-1], w=part.slice(1,-1).map(p=>`${p.lat},${p.lng}`).join("|");
  return `https://www.google.com/maps/dir/?api=1&origin=${o.lat},${o.lng}&destination=${d.lat},${d.lng}${w?`&waypoints=${encodeURIComponent(w)}`:""}&travelmode=${mode}`;
}
function optimize(ids){
  if (ids.length<3) return ids;
  const pts=ids.map(id=>byId[id]); const rest=pts.slice(1), path=[pts[0]];
  while(rest.length){ const last=path[path.length-1]; let bi=0, bd=1e9;
    rest.forEach((p,i)=>{ const d=km(last,p); if(d<bd){bd=d;bi=i;} }); path.push(rest.splice(bi,1)[0]); }
  // 2-opt 다듬기 (출발지는 고정)
  let improved=true, n=path.length, guard=0;
  while(improved && guard++<50){ improved=false;
    for(let i=1;i<n-2;i++) for(let j=i+1;j<n-1;j++){
      const a=path[i-1],b=path[i],c=path[j],d=path[j+1];
      if (km(a,c)+km(b,d) < km(a,b)+km(c,d)-1e-9){ path.splice(i, j-i+1, ...path.slice(i,j+1).reverse()); improved=true; }
    } }
  return path.map(p=>p.cid);
}
function renderCourse(){

  if (!stops.length){

    return;
  }
  let total=0; const legs=[];
  for (let i=0;i<stops.length-1;i++){ const k=km(stops[i],stops[i+1]); total+=k; legs.push(k); }
  const chunks = routeChunks(stops);
  const modeName = {walking:"도보", driving:"자동차"};
  $("course").innerHTML = `
    <div class="csum">
      <div><div class="big">${stops.length}곳 · ${fmtKm(total)}</div><div class="small">걸어서 약 ${fmtMin(walkMin(total))}</div></div>

        <button class="btn" id="opt" ${stops.length<3?"disabled":""}>가까운 순서로 정렬</button>

      <div class="stop" style="--c:var(${CVAR[p.c]})">
        <div class="num">${i+1}</div>
        <div style="min-width:0"><div class="sn" data-pick="${p.cid}">${esc(p.n)}</div><div class="sm"><span style="color:var(--c);font-weight:600">${esc(p.s)}</span> · ${esc(hood(p))}</div></div>
        <div class="ctl">
          <button data-mv="${i}:-1" aria-label="위로" ${i===0?"disabled":""}>${ICON_UP}</button>
          <button data-mv="${i}:1" aria-label="아래로" ${i===stops.length-1?"disabled":""}>${ICON_DOWN}</button>
          <button data-rm="${p.cid}" aria-label="빼기">${ICON_X}</button>
        </div>
      </div>
      ${i<stops.length-1 ? `<div class="leg">${fmtKm(legs[i])} · 도보 ${fmtMin(walkMin(legs[i]))} <a href="${gleg(p,stops[i+1])}" target="_blank" rel="noopener">대중교통</a></div>` : ""}`).join("")}
    </div>
    ${stops.length>1 ? `<div class="routes">
      <div class="row"><span class="small" style="color:var(--muted);font-size:12px">전체 경로 이동 수단</span>
        <div class="seg" id="mode">${Object.entries(modeName).map(([k,v])=>`<button data-mode="${k}" aria-pressed="${C.mode===k}">${v}</button>`).join("")}</div></div>
      ${chunks.map((part,i)=>`<a class="btn primary" style="height:40px" href="${routeUrl(part,C.mode)}" target="_blank" rel="noopener">
        구글맵에서 ${chunks.length>1?`경로 ${i+1} (${stops.indexOf(part[0])+1}–${stops.indexOf(part[0])+part.length}번)`:"경로"} 열기</a>`).join("")}
      ${chunks.length>1?`<div class="note">구글맵은 한 번에 10곳까지라 나눠서 열어요.</div>`:""}
    </div>` : ""}`;
  $("opt").onclick=()=>{ d.ids=optimize(d.ids); saveCourse(); refreshCourseBits(); };
  $("cfit").onclick=()=>{ if(isMobile()) setSheet("min"); fit(stops, 70); };
  $("cclear").onclick=()=>{ d.ids=[]; saveCourse(); refreshCourseBits(); };
  const m=$("mode"); if(m) m.onclick=e=>{ const b=e.target.closest("[data-mode]"); if(!b) return; C.mode=b.dataset.mode; saveCourse(); renderCourse(); };
}

/* 묶음(클러스터): 월드 좌표 격자로 나눠서, 이동 중엔 바뀌지 않고 확대할 때만 다시 계산 */
let cluCache={s:null,key:""};
function clusters(){
  const vis=PLACES.filter(p=>p.show);
  const key=vis.map(p=>p.cid).join(",")+"|"+S.sel;
  if (cluCache.s===V.s && cluCache.key===key) return cluCache.res;
  const res={single:new Set(), groups:[]};
  if (V.s >= fitS*3.2){ vis.forEach(p=>res.single.add(p.cid)); }
  else {
    const cell=58/V.s, grid=new Map();
    vis.forEach(p=>{ const k=Math.floor(p.x/cell)+":"+Math.floor(p.y/cell); (grid.get(k)||grid.set(k,[]).get(k)).push(p); });
    grid.forEach(arr=>{
      if (arr.length<3 || arr.some(p=>p.cid===S.sel)) arr.forEach(p=>res.single.add(p.cid));
      else res.groups.push(arr);
    });
  }
  cluCache={s:V.s,key,res}; return res;
}
function renderClusters(res){
  L.clu.innerHTML="";
  res.groups.forEach(arr=>{
    const x=arr.reduce((a,p)=>a+p.x,0)/arr.length, y=arr.reduce((a,p)=>a+p.y,0)/arr.length;
    const vs=new Set(arr.map(pinVar)), col=vs.size===1?`var(${pinVar(arr[0])})`:"var(--ink)";
    const r=(11+Math.min(10,Math.sqrt(arr.length)*2.2))/V.s;

  // 동네 전부 보기에서는 숙소·관광처럼 추천에 안 쓰는 분류도 뒤에 붙인다
  const order = R.key==="me" ? recOrder(h) : [...recOrder(h), ...CATS.map(c=>c[0]).filter(c=>!REC_N[c])];
  recSecs = order.filter(c=>S.cat==="전체" || c===S.cat).map(c=>[c, pickNear(c, R.base)]).filter(([c,arr])=>REC_N[c] || arr.length);
  const n = recSecs.reduce((a,[,arr])=>a+arr.length,0);
  const total=PLACES.filter(p=>p.h===R.base.label).length;
  const hidden = R.key!=="me" && n<total;
  $("rec").innerHTML = `<div class="rtop"><div><div class="big">${R.key==="me"?`내 위치 근처 추천 ${n}곳`:`${esc(R.base.label)} ${n}곳`}</div>
      <div class="small">도쿄 ${tokyoTime()} · ${R.key==="me"?`${RADIUS}km 안`:"이 동네 전부"}</div></div>
      <button class="btn" id="recadd" ${n<2?"disabled":""}>코스로 담기</button>
      ${hidden?`<div class="rmore"><span class="small">필터 때문에 전체 ${total}곳 중 ${n}곳만 보여요.</span><button class="btn primary" id="recall">필터 풀기</button></div>`:""}</div>`
    + recSecs.map(([c,arr])=>`<div class="rech"><h3 style="--c:var(${CVAR[c]})"><span class="dot"></span>${REC_NAME[c]||c}</h3><span>${arr.length?"":(R.key==="me"?"근처에 저장한 곳 없음":"이 동네엔 없음")}</span></div>`
      + arr.map(({p,d})=>`<div class="ritem" style="--c:var(${CVAR[p.c]})"><div class="bar"></div>
          <div style="min-width:0"><div class="rn" data-pick="${p.cid}">${mk(p.cid).f?ICON_STAR_S:""}${esc(p.n)}</div>
            <div class="rm">${esc(typeLabel(p))}${R.key==="me"?` · ${fmtKm(d)} · 걸어서 ${fmtMin(walkMin(d))}`:""}${mk(p.cid).v?" · 다녀옴":""}</div></div>
          <div class="ra">${saveIc(p.cid)}${courseBtn(p.cid)}<a class="btn primary" href="${gmap(p)}" target="_blank" rel="noopener">구글맵</a></div></div>`).join("")).join("");
  const all=$("recall"); if(all) all.onclick=clearRecFilters;
  const ra=$("recadd"); if(ra) ra.onclick=()=>{
    // 시간대 순서대로 분류마다 1곳씩(쇼핑은 2곳), 술집은 저녁 이후에만
    const night = h>=17 || h<4, d=day();
    recSecs.forEach(([c,arr])=>{ if(!REC_N[c] || (c==="술집" && !night)) return; arr.slice(0, c==="쇼핑"?2:1).forEach(({p})=>{ if(!d.ids.includes(p.cid)) d.ids.push(p.cid); }); });
    saveCourse(); refreshCourseBits(); setTab("course");
  };
}
function focusRec(){
  if (!R.base) return; const [x,y]=proj(R.base.lat,R.base.lng);
  const pts=[{x,y}, ...recSecs.flatMap(([,a])=>a.map(o=>o.p))];
  if (pts.length>1) fit(pts, 40); else flyTo(x,y,areaScale(1));
}
let baseDot=null;
function drawBase(){
  L.base.innerHTML=""; baseDot=null;
  if (S.tab!=="rec" || !R.base || R.key!=="me") return;
  const [x,y]=proj(R.base.lat,R.base.lng);
  el("circle",{cx:x,cy:y,r:RADIUS*1000/11.1,fill:"var(--accent)","fill-opacity":.06,stroke:"var(--accent)","stroke-width":1.5,"stroke-dasharray":"6 5","vector-effect":"non-scaling-stroke"},L.base);
  baseDot=el("circle",{cx:x,cy:y,fill:"var(--accent)",stroke:"var(--panel)","stroke-width":2,"vector-effect":"non-scaling-stroke"},L.base);
}
$("recbase").addEventListener("click", e=>{
  const b=e.target.closest("[data-rb]"); if(!b) return; const k=b.dataset.rb;
  if (k==="me"){ locate(true); return; }
  if(isMobile() && sheetState!=="mid") setSheet("mid");
  // 전체, 또는 고른 동네를 한 번 더 누르면: 동네 선택을 풀고 지도를 전체로 되돌림
  if (k==="all" || k===R.key){ chooseRecArea(""); fit(PLACES.filter(p=>p.show)); return; }
  // 동네 버튼: 그 동네 가게를 전부 보여주고 지도를 거기로 맞춤
  chooseRecArea(k);
});
// 전체 화면의 동네 타일은 위쪽 동네 버튼을 누른 것과 같다
$("rec").addEventListener("click", e=>{ const t=e.target.closest("[data-hood]"); if(t) $("recbase").querySelector(`[data-rb="${t.dataset.hood}"]`).click(); });
// 내 위치
let ME=null, meDot=null, toastT;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, 3200); }
function drawMe(){
  L.me.innerHTML=""; meDot=null; if(!ME) return; const [x,y]=proj(ME.lat,ME.lng);
  meDot=[el("circle",{cx:x,cy:y,fill:"#2f7cf6","fill-opacity":.18},L.me), el("circle",{cx:x,cy:y,fill:"#2f7cf6",stroke:"#fff","stroke-width":2.5,"vector-effect":"non-scaling-stroke"},L.me)];
}
function locate(forRec){
  if (!navigator.geolocation){ toast("이 브라우저에서는 위치를 쓸 수 없어요"); return; }
  const zb=$("zme"); zb.classList.add("busy");
  navigator.geolocation.getCurrentPosition(pos=>{
    zb.classList.remove("busy");
    ME={lat:pos.coords.latitude, lng:pos.coords.longitude};
    if (km(ME,{lat:35.68,lng:139.73})>40){ ME=null; drawMe(); toast("지금은 도쿄 밖이에요. 동네를 골라 보세요"); return; }
    drawMe(); startWatch();
    if (forRec || S.tab==="rec"){ R.base={...ME, label:"내 위치"}; R.key="me"; syncRecWard(); if(S.tab!=="rec") setTab("rec"); else update(); drawBase(); focusRec(); }
    else { const [x,y]=proj(ME.lat,ME.lng); flyTo(x,y,Math.max(V.s,areaScale(1))); }
  }, err=>{ zb.classList.remove("busy"); toast(err.code===1?"위치 권한이 꺼져 있어요. 브라우저 설정에서 켜 주세요":"위치를 가져오지 못했어요"); },
  {enableHighAccuracy:true, timeout:10000, maximumAge:60000});
}
$("zme").onclick=()=>locate(false);
// 한 번 위치를 잡은 뒤에는 걷는 동안 파란 점이 따라온다. 60m 넘게 움직이면 내 위치 추천도 다시 고른다
let watchId=null;
function startWatch(){
  if (watchId!==null) return; $("zme").classList.add("on");
  watchId=navigator.geolocation.watchPosition(pos=>{
    const me={lat:pos.coords.latitude, lng:pos.coords.longitude};
    if (km(me,{lat:35.68,lng:139.73})>40) return;
    ME=me; drawMe();
    if (R.key==="me" && R.base && km(R.base,ME)>.06){ R.base={...ME, label:"내 위치"}; if(S.tab==="rec"){ renderRec(); drawBase(); } }
    apply();
  }, ()=>{}, {enableHighAccuracy:true, maximumAge:15000});
}

/* ---------- 폰: 아래 시트 ---------- */
const mq = matchMedia("(max-width:860px)");
function isMobile(){ return mq.matches; }
const sheet=$("sheet");
let sheetState="min";
const SNAP = { min:()=>Math.round(Math.min(132, innerHeight*.2)), mid:()=>Math.round(innerHeight*.46), max:()=>sheet.offsetHeight };
function setVis(v){ document.documentElement.style.setProperty("--sheet-vis", v+"px"); }
function setSheet(st, anim=true){
  if (!isMobile()){ sheet.style.transform=""; sheet.style.transition=""; setVis(0); return; }
  sheetState=st; const vis=Math.min(SNAP[st](), sheet.offsetHeight);
  sheet.style.transition = anim ? "transform .26s cubic-bezier(.2,.8,.2,1)" : "none";
  sheet.style.transform = `translateY(${sheet.offsetHeight-vis}px)`; setVis(vis);
}
function layoutTop(){
  if (!isMobile()){ document.documentElement.style.removeProperty("--top-h"); return; }
  document.documentElement.style.setProperty("--top-h", Math.round($("controls").getBoundingClientRect().bottom)+"px");
}
// 폰에서는 지역·상태 필터와 안내문을 시트 안으로 옮긴다
function placeParts(){
  const ward=$("ward"), seg=document.querySelector(".seg"), foot=document.querySelector(".foot");
  const tabs=document.querySelector(".tabs"); // 폰: 탭 줄을 아래 고정 탭바로
  if (isMobile()){ if(ward.parentNode!==$("mfilters")){ $("mfilters").append(ward, seg); $("sheetBody").append(foot); $("navbar").append(tabs); } }
  else if (ward.parentNode!==$("ctlrow")){ $("ctlrow").append(ward, seg); document.querySelector(".wrap").append(foot); sheet.insertBefore(tabs, $("sheetBody")); }
}
(()=>{ // 손잡이나 탭 줄을 위아래로 끌어서 시트 높이 조절
  let y0=null, t0=0, drag=false, last=0, lastT=0, vy=0, src=null;
  const cur=()=>{ const m=/translateY\(([-\d.]+)px\)/.exec(sheet.style.transform); return m?+m[1]:0; };
  const start=e=>{ if(!isMobile() || e.currentTarget.closest("#navbar")) return; y0=e.clientY; t0=cur(); drag=false; last=y0; lastT=performance.now(); vy=0; src=e.currentTarget; };
  const move=e=>{ if(y0===null) return;
    if (!drag){ if(Math.abs(e.clientY-y0)<6) return; drag=true; src.setPointerCapture(e.pointerId); sheet.style.transition="none"; }
    const lim=sheet.offsetHeight-SNAP.min(), t=Math.max(0,Math.min(lim,t0+e.clientY-y0));
    sheet.style.transform=`translateY(${t}px)`;
    const now=performance.now(); vy=(e.clientY-last)/Math.max(1,now-lastT); last=e.clientY; lastT=now; };
  const end=()=>{ if(y0===null) return; y0=null; if(!drag) return; drag=false;
    const vis=sheet.offsetHeight-cur();
    let st=Object.keys(SNAP).map(k=>[k,Math.abs(SNAP[k]()-vis)]).sort((a,b)=>a[1]-b[1])[0][0];
    if (vy<-.45) st = vis>SNAP.mid()?"max":"mid"; else if (vy>.45) st = vis<SNAP.mid()?"min":"mid";
    setSheet(st); };
  [$("grab"), document.querySelector(".tabs")].forEach(h=>{ h.addEventListener("pointerdown",start); h.addEventListener("pointermove",move);
    h.addEventListener("pointerup",end); h.addEventListener("pointercancel",end); });
  $("grab").addEventListener("click",()=>setSheet(sheetState==="min"?"mid":sheetState==="mid"?"max":"min"));
})();

function update(refit){
  PLACES.forEach(p=>{ p.show=matches(p); p.el.setAttribute("fill",`var(${pinVar(p)})`); });
  renderLegend();
  renderChips(); if(S.tab==="list") renderList(); if(S.tab==="rec") renderRec(); if(S.tab==="saved") renderSaved(); renderStats(); setBadge("cbadge", day().ids.length);
  setBadge("sbadge", PLACES.filter(p=>mk(p.cid).f).length);
  if (isMobile()){ layoutTop(); setSheet(sheetState,false); }
  cluCache.s=null; if(refit) fit(PLACES.filter(p=>p.show)); else apply();
}

renderLegend(); drawRoute(); placeParts();
setTab(isMobile()?"rec":"list", true);
update(); layoutTop(); setSheet("min",false);
requestAnimationFrame(()=>{ layoutTop(); setSheet("min",false); fit(); });
// 폰은 주소창이 들어갔다 나올 때마다 높이가 바뀌니, 너비가 바뀔 때만 다시 맞춘다
let rz, lastW=innerWidth; addEventListener("resize",()=>{clearTimeout(rz); rz=setTimeout(()=>{
  placeParts(); layoutTop(); setSheet(sheetState,false);
  if (innerWidth!==lastW){ lastW=innerWidth; fit(); } else apply(); },150)});
</script>
</html>
